<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>СМЕНА — учёт производства</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#EFECE5; --paper:#FAF8F4; --ink:#1E1C17; --soft:#75716A; --soft2:#9B968A;
    --line:#DCD7CA; --panel:#1C1B17; --panel-line:#2C2A23;
    --accent:#E8590C; --accent-d:#C64A08;
    --green:#2E8B44; --brick:#B5442C; --seam:#57534A; --danger:#B03A22;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  body.splash-on{overflow:hidden}
  button{font-family:inherit}
  .mono{font-family:'IBM Plex Mono',monospace}
  svg{flex-shrink:0}

  /* ─── Заставка ─── */
  .splash{position:fixed;inset:0;z-index:200;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .55s ease,visibility .55s}
  .splash.hide{opacity:0;visibility:hidden}
  .splash-mark{width:16px;height:16px;background:var(--accent);animation:markIn .55s cubic-bezier(.2,.9,.3,1) both}
  @keyframes markIn{from{opacity:0;transform:scale(0) rotate(45deg)}to{opacity:1;transform:none}}
  .splash-name{margin-top:24px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:46px;letter-spacing:.06em;color:#F3F0E9;display:flex}
  .splash-name span{display:inline-block;opacity:0;transform:translateY(18px);animation:letterIn .5s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes letterIn{to{opacity:1;transform:none}}
  .splash-sub{margin-top:15px;font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.34em;text-transform:uppercase;color:#8D897E;opacity:0;animation:fadeUp .5s .8s forwards}
  .splash-track{position:relative;margin-top:38px;width:210px;height:4px;background:#2C2A23;border-radius:2px;overflow:hidden}
  .splash-track i{display:block;height:100%;width:0;background:var(--accent);animation:splashFill 2.05s linear .15s forwards}
  .splash-track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 1px),rgba(243,240,233,.14) calc(20% - 1px),rgba(243,240,233,.14) 20%);pointer-events:none}
  @keyframes splashFill{to{width:100%}}
  .splash-skip{position:absolute;bottom:28px;font:600 9.5px 'IBM Plex Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:#57534A;opacity:0;animation:fadeUp .5s 1.1s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  body.ready main{animation:mainIn .5s cubic-bezier(.2,.9,.3,1) both}
  @keyframes mainIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .splash{display:none} }
  @media (max-width:600px){ .splash-name{font-size:34px} .splash-track{width:170px} }

  /* ─── Каркас ─── */
  .app{display:flex;min-height:100vh}
  .sidebar{width:250px;background:var(--panel);color:#EDEAE3;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:20}
  .logo{padding:28px 24px 22px;display:flex;gap:12px;align-items:flex-start}
  .logo-mark{width:12px;height:12px;background:var(--accent);margin-top:6px}
  .logo-name{font-family:'Unbounded',sans-serif;font-weight:700;font-size:19px;letter-spacing:.05em;line-height:1}
  .logo-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#8D897E;margin-top:6px}
  .sidebar nav{padding:6px 12px;display:flex;flex-direction:column;gap:4px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border:0;background:none;color:#B4B0A4;font:500 14px 'IBM Plex Sans';cursor:pointer;border-radius:6px;position:relative;text-align:left;transition:background .16s,color .16s;width:100%}
  .nav-item svg{width:17px;height:17px}
  .nav-item:hover{background:#26251F;color:#EDEAE3}
  .nav-item.active{background:#2B2A21;color:#fff}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:11px;width:3px;height:20px;background:var(--accent);border-radius:0 2px 2px 0}
  .nav-item .count{margin-left:auto;font:600 12px 'IBM Plex Mono',monospace;color:#7C786D}
  .nav-item.active .count{color:var(--accent)}
  .side-foot{margin-top:auto;padding:18px 22px;border-top:1px solid var(--panel-line)}
  .side-foot-row{display:flex;align-items:center;gap:9px;font:500 12px 'IBM Plex Mono',monospace;color:#A6A296}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .side-foot-sub{margin-top:7px;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#6C695F}

  main{margin-left:250px;flex:1;padding:34px 42px 70px;min-width:0}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
  .topbar h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
  .topbar .sub{margin-top:6px;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A8579}
  .stats{margin:14px 0 20px;font:500 12.5px 'IBM Plex Mono',monospace;color:var(--soft)}
  .stats b{color:var(--ink);font-weight:700}

  .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:0;padding:12px 20px;border-radius:6px;font:600 14px 'IBM Plex Sans';cursor:pointer;transition:background .15s,transform .12s}
  .btn-primary svg{width:16px;height:16px}
  .btn-primary:hover{background:var(--accent-d)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary:disabled{background:#B9B4A6;cursor:not-allowed;transform:none}

  /* ─── Список заявок ─── */
  .order-list{border-top:1px solid var(--line);max-width:1180px}
  .order-row{display:grid;grid-template-columns:140px 1.1fr 360px 168px;gap:26px;align-items:center;padding:18px 8px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;animation:rise .35s both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .order-row:hover{background:#F6F4EE}
  .o-num{font:700 21px 'IBM Plex Mono',monospace}
  .o-accepted{margin-top:4px;font-size:12px;color:var(--soft)}
  .o-colors{display:flex;flex-wrap:wrap;gap:7px}
  .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(30,28,20,.055);border-radius:4px;padding:4px 9px;font:500 12.5px 'IBM Plex Sans'}
  .tag svg{width:13px;height:13px;color:var(--seam)}
  .tag.brick-tag svg{color:var(--brick)}
  .tag.fmt-tag{background:rgba(30,28,20,.085);font-weight:600}
  .tag.fmt-tag svg{color:var(--ink)}
  .tag .tq{font:700 12px 'IBM Plex Mono',monospace;color:#6E6A60}
  .o-spec{margin-top:7px;font:500 12px 'IBM Plex Mono',monospace;color:var(--soft)}
  .prow{display:grid;grid-template-columns:56px 1fr 64px 62px;gap:10px;align-items:center}
  .prow + .prow{margin-top:9px}
  .prow.el{grid-template-columns:minmax(78px,128px) 1fr 50px 58px}
  .plabel{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.09em;color:#6E6A60}
  .plabel.el{font:600 12px 'IBM Plex Sans';letter-spacing:0;text-transform:none;color:#4E4A42;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .pval{font:600 12px 'IBM Plex Mono',monospace;text-align:right}
  .premain{font:500 11px 'IBM Plex Mono',monospace;color:var(--accent-d);text-align:right}
  .premain.done{color:var(--green)}
  .track{position:relative;height:9px;background:#DBD6C9;border-radius:2px;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:var(--seam);transition:width .7s cubic-bezier(.25,.9,.3,1)}
  .track.brick i{background:var(--brick)}
  .track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(30,28,20,.16) calc(10% - 1px),rgba(30,28,20,.16) 10%);pointer-events:none}
  .o-side{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .badge{display:inline-block;font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:4px;white-space:nowrap}
  .b-new{border:1.5px solid #A29D8F;color:#615D53;background:transparent}
  .b-production{background:rgba(232,89,12,.13);color:var(--accent-d)}
  .b-ready{background:rgba(46,139,68,.15);color:var(--green)}
  .chev{width:18px;height:18px;color:#A39E90;transition:transform .18s}
  .order-row:hover .chev{transform:translateX(3px)}

  .empty{border:1.5px dashed #C7C1B1;border-radius:10px;padding:60px 24px;text-align:center;color:var(--soft);max-width:1180px}
  .empty svg{width:34px;height:34px;color:#B3AD9E}
  .empty h3{margin:14px 0 6px;font-size:17px;color:var(--ink)}
  .empty p{font-size:13.5px;margin-bottom:20px}

  /* ─── История ─── */
  .hist-list{max-width:820px;border-top:1px solid var(--line)}
  .hist-item{display:grid;grid-template-columns:118px 1fr;gap:22px;padding:20px 6px;border-bottom:1px solid var(--line);animation:rise .35s both}
  .h-date{font:700 15px 'IBM Plex Mono',monospace}
  .h-logged{margin-top:5px;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#A19C8E}
  .h-head{font-size:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .h-head b{font-family:'IBM Plex Mono',monospace;font-weight:700}
  .h-sec{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);background:rgba(30,28,20,.06);padding:3px 7px;border-radius:3px}
  .h-work{margin-top:9px;display:flex;gap:16px;flex-wrap:wrap}
  .h-work span{display:inline-flex;align-items:center;gap:6px;font:600 13px 'IBM Plex Sans'}
  .h-work svg{width:14px;height:14px;color:var(--seam)}
  .h-work .bw svg{color:var(--brick)}
  .h-people{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .h-people .pchip{background:#E8E4D8;border-radius:4px;padding:3px 9px;font:500 12.5px 'IBM Plex Sans';color:#4E4A42}
  .hist-del-row{margin-top:11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hdel{display:inline-flex;align-items:center;gap:6px;border:1px solid #E0C4BC;background:transparent;color:var(--danger);border-radius:5px;padding:5px 10px;font:600 12px 'IBM Plex Sans';cursor:pointer;transition:all .15s}
  .hdel svg{width:13px;height:13px}
  .hdel:hover{background:rgba(176,58,34,.08);border-color:var(--danger)}
  .hexp{display:inline-flex;align-items:center;gap:6px;font:500 11.5px 'IBM Plex Mono',monospace;color:#A19C8E}
  .hexp svg{width:12px;height:12px}

  /* ─── Drawer ─── */
  .scrim{position:fixed;inset:0;background:rgba(24,22,15,.46);opacity:0;pointer-events:none;transition:opacity .25s;z-index:55}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:490px;max-width:100vw;background:var(--paper);box-shadow:-20px 0 60px rgba(20,18,10,.2);transform:translateX(103%);transition:transform .32s cubic-bezier(.25,.9,.3,1);z-index:60;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dr-head{padding:26px 28px 20px;border-bottom:1px solid var(--line);position:relative}
  .dr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .dr-num{font:700 26px 'IBM Plex Mono',monospace}
  .dr-sub{margin-top:6px;font-size:12.5px;color:var(--soft)}
  .dr-badge{margin-top:11px;display:inline-block}
  .icon-btn{width:34px;height:34px;border:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--soft);transition:background .15s}
  .icon-btn:hover{background:rgba(30,28,20,.07);color:var(--ink)}
  .icon-btn svg{width:19px;height:19px}
  .stamp{position:absolute;top:22px;right:76px;transform:rotate(-8deg);border:2.5px solid var(--green);outline:1.5px solid var(--green);outline-offset:3px;border-radius:4px;color:var(--green);background:rgba(46,139,68,.06);padding:9px 13px;font:700 13px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.35;animation:stampIn .45s cubic-bezier(.2,.9,.3,1) both;pointer-events:none}
  .stamp small{display:block;font-size:8px;letter-spacing:.3em;font-weight:600;opacity:.85}
  @keyframes stampIn{0%{opacity:0;transform:rotate(-8deg) scale(2.3)}55%{opacity:1;transform:rotate(-8deg) scale(.92)}75%{transform:rotate(-8deg) scale(1.06)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
  .dr-body{overflow-y:auto;flex:1;padding:22px 28px 34px}
  .spec-row{display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-bottom:1px dashed #DED9CC;font-size:13.5px}
  .spec-row span{color:var(--soft)}
  .spec-row b{text-align:right;font-weight:600}
  .dp{padding:15px 4px 15px 16px;border-left:3px solid var(--seam);margin-top:14px}
  .dp.brick-dp{border-left-color:var(--brick)}
  .dp-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .dp-label{display:inline-flex;align-items:center;gap:7px;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.09em;color:#5C584F}
  .dp-label svg{width:14px;height:14px}
  .dp-label .mk-color{font:400 12px 'IBM Plex Sans';color:var(--soft);letter-spacing:0;text-transform:none;margin-left:4px}
  .dp-nums{font:500 15px 'IBM Plex Mono',monospace;color:var(--soft)}
  .dp-nums b{color:var(--ink);font-weight:700}
  .track.big{height:12px;margin:11px 0 9px}
  .dp-rem{font-size:13px;color:var(--soft)}
  .dp-rem b{color:var(--ink)}
  .dp-rem.done{display:flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
  .dp-rem.done svg{width:15px;height:15px}
  .dr-actions{margin-top:22px}
  .dr-actions .btn-primary{width:100%}
  .dr-status{margin-top:24px}
  .lbl{display:block;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:9px;background:#fff}
  .seg button{flex:1;padding:10px 4px;border:0;background:#fff;font:600 12px 'IBM Plex Sans';cursor:pointer;color:var(--soft);transition:background .15s,color .15s;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button:hover{background:#F3F0E9}
  .seg button.on[data-st="new"]{background:#EAE6DB;color:var(--ink)}
  .seg button.on[data-st="production"]{background:rgba(232,89,12,.15);color:var(--accent-d)}
  .seg button.on[data-st="ready"]{background:rgba(46,139,68,.16);color:var(--green)}

  /* ─── Удаление ─── */
  .del-zone{margin-top:22px;padding-top:16px;border-top:1px dashed #DED9CC}
  .btn-danger-outline{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 16px;border:1.5px solid #E0C4BC;background:transparent;color:var(--danger);border-radius:6px;font:600 13.5px 'IBM Plex Sans';cursor:pointer;transition:all .15s}
  .btn-danger-outline svg{width:15px;height:15px}
  .btn-danger-outline:hover{background:rgba(176,58,34,.08);border-color:var(--danger)}
  .btn-danger-outline:disabled{opacity:.55;cursor:not-allowed}
  .del-hint{margin-top:9px;font-size:12px;color:var(--soft);display:flex;gap:6px;align-items:flex-start;line-height:1.5}
  .del-hint svg{width:13px;height:13px;margin-top:1px;color:#A19C8E}
  .del-hint.locked{color:#8A8579}

  .dr-hist{margin-top:28px}
  .dr-hist h4{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .he{padding:13px 0;border-bottom:1px dashed #DED9CC}
  .he-date{font:600 12.5px 'IBM Plex Mono',monospace}
  .he-work{margin-top:5px;font:600 13px 'IBM Plex Sans';color:#4E4A42}
  .he-work em{font-style:normal;color:var(--seam)}
  .he-work em.bw{color:var(--brick)}
  .he-people{margin-top:4px;font-size:12.5px;color:var(--soft)}
  .he .hist-del-row{margin-top:8px}
  .dr-empty{padding:16px 0;font-size:13px;color:var(--soft)}

  /* ─── Модал ─── */
  .modal-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-wrap.show{opacity:1;pointer-events:auto}
  .modal{background:var(--paper);border-radius:12px;width:580px;max-width:100%;max-height:92vh;overflow-y:auto;padding:26px 30px 28px;transform:translateY(16px) scale(.98);transition:transform .26s cubic-bezier(.2,.9,.3,1);box-shadow:0 30px 80px rgba(20,18,8,.35)}
  .modal-wrap.show .modal{transform:none}
  .m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
  .m-kicker{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-d)}
  .m-head h3{margin-top:6px;font-size:21px;font-weight:700}
  .field{margin-top:15px}
  .field label{display:flex;align-items:baseline;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#6E6A60;margin-bottom:7px}
  .fnum{color:var(--accent-d);margin-right:9px}
  .field input{width:100%;padding:11px 13px;border:1.5px solid #D3CEC0;border-radius:6px;background:#fff;font:500 15px 'IBM Plex Sans';color:var(--ink);transition:border-color .15s}
  .field input:focus{border-color:var(--accent);outline:none}
  .field input.big-mono{font:600 17px 'IBM Plex Mono',monospace}
  .ferr{display:none;margin-top:6px;font-size:12.5px;color:#C0341D}
  .ferr.show{display:block}
  .hint{display:flex;gap:7px;align-items:flex-start;margin-top:9px;font-size:12.5px;color:var(--soft);line-height:1.45}
  .hint svg{width:14px;height:14px;margin-top:1px;color:var(--accent-d)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .thick-seg{display:flex;gap:6px}
  .thick-seg button{flex:1;padding:10px 0;border:1.5px solid #D3CEC0;background:#fff;border-radius:6px;font:600 14px 'IBM Plex Mono',monospace;cursor:pointer;color:#57534A;transition:all .12s}
  .thick-seg button:hover{border-color:#9C9788}
  .thick-seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ─── Формат панели ─── */
  .format-seg{display:flex;gap:8px}
  .format-seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px 11px;border:1.5px solid #D3CEC0;background:#fff;border-radius:8px;cursor:pointer;transition:all .12s;font:600 13.5px 'IBM Plex Sans';color:#57534A}
  .format-seg button svg{width:20px;height:20px}
  .format-seg button:hover{border-color:#9C9788}
  .format-seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .format-seg button.on svg{color:#fff}

  .m-submit{margin-top:24px;width:100%}

  /* ─── Элементы (фасадный декор) ─── */
  .elem-head{display:grid;grid-template-columns:1fr 118px 34px;gap:8px;margin-bottom:6px;font:600 9.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#8A8579;line-height:1.35;align-items:end}
  .elem-head span:last-child{text-align:center}
  .elem-row{display:grid;grid-template-columns:1fr 118px 34px;gap:8px;margin-bottom:8px;animation:rise .25s both;align-items:center}
  .elem-row input{width:100%;padding:10px 12px;border:1.5px solid #D3CEC0;border-radius:6px;background:#fff;font:500 14.5px 'IBM Plex Sans';color:var(--ink);transition:border-color .15s}
  .elem-row input:focus{border-color:var(--accent);outline:none}
  .elem-row .e-qty{text-align:center;font:600 15px 'IBM Plex Mono',monospace;padding:10px 6px}
  .elem-row .e-rm{align-self:center}
  .add-elem{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px;border:1.5px dashed #C7C1B1;background:transparent;color:var(--soft);border-radius:6px;font:600 13.5px 'IBM Plex Sans';cursor:pointer;transition:all .15s;margin-top:2px}
  .add-elem svg{width:15px;height:15px}
  .add-elem:hover{border-color:var(--accent);color:var(--accent-d);background:rgba(232,89,12,.05)}
  .elem-total{margin-top:11px;font:600 12px 'IBM Plex Mono',monospace;color:var(--soft)}
  .elem-total b{color:var(--ink);font-weight:700}

  /* модал отметки */
  .mk-stage{border:1px solid var(--line);border-radius:9px;padding:16px 18px;background:#fff;margin-top:14px}
  .mk-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .mk-rem{font:600 12px 'IBM Plex Mono',monospace;color:var(--accent-d)}
  .mk-rem.zero{color:var(--green)}
  .mk-inputs{display:flex;align-items:center;gap:12px;margin-top:13px}
  .mk-inputs input{width:110px;text-align:center;padding:8px 6px;border:1.5px solid #D3CEC0;border-radius:6px;font:700 20px 'IBM Plex Mono',monospace;color:var(--ink)}
  .mk-inputs input:focus{border-color:var(--accent);outline:none}
  .mk-unit{font-size:13px;color:var(--soft)}
  .mk-calc{margin-top:13px}
  .mk-calc-row{margin-top:9px;font:500 12px 'IBM Plex Mono',monospace;color:var(--soft)}
  .mk-calc-row b{color:var(--ink);font-weight:700}
  .mk-clamp{display:none;margin-top:7px;font-size:12px;color:#C0341D}
  .mk-clamp.show{display:block}
  .chips{display:flex;flex-wrap:wrap;gap:6px;border:1.5px solid #D3CEC0;border-radius:6px;padding:6px 8px;background:#fff;transition:border-color .15s}
  .chips:focus-within{border-color:var(--accent)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#EBE7DB;border-radius:4px;padding:4px 8px;font:500 13px 'IBM Plex Sans'}
  .chip button{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;color:#8A8579;padding:0 1px}
  .chip button:hover{color:#C0341D}
  .chips input{border:0;outline:none;flex:1;min-width:130px;font:500 15px 'IBM Plex Sans';padding:6px 4px;background:transparent;color:var(--ink)}

  /* модал подтверждения удаления */
  .confirm-text{font-size:14px;line-height:1.6;color:#4E4A42}
  .confirm-text b{color:var(--ink)}
  .confirm-warn{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:11px 13px;border:1px solid #E8C8BF;background:rgba(176,58,34,.06);border-radius:7px;font-size:12.5px;color:#8F3118;line-height:1.5}
  .confirm-warn svg{width:15px;height:15px;margin-top:1px;color:var(--danger)}
  .confirm-actions{display:flex;gap:10px;margin-top:22px}
  .confirm-actions button{flex:1;padding:12px;border-radius:6px;font:600 14px 'IBM Plex Sans';cursor:pointer;transition:all .15s}
  .c-cancel{border:1.5px solid var(--line);background:#fff;color:var(--ink)}
  .c-cancel:hover{background:#F3F0E9}
  .c-del{border:0;background:var(--danger);color:#fff}
  .c-del:hover{background:#9C321C}

  /* тосты */
  .toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
  .toast{display:flex;align-items:center;gap:10px;background:#211F19;color:#F3F0E9;padding:12px 18px;border-radius:8px;font:500 13.5px 'IBM Plex Sans';border-left:3px solid var(--accent);box-shadow:0 12px 34px rgba(0,0,0,.32);animation:tin .3s cubic-bezier(.2,.9,.3,1);max-width:92vw}
  .toast svg{width:16px;height:16px;color:#7BC47F}
  .toast.info svg{color:#F09042}
  .toast.out{opacity:0;transform:translateY(8px);transition:.3s}
  @keyframes tin{from{opacity:0;transform:translateY(12px)}}

  /* ─── адаптив ─── */
  @media (max-width:1150px){
    .order-row{grid-template-columns:120px 1fr 168px}
    .o-progress{grid-column:1/-1;order:3}
  }
  @media (max-width:920px){
    .app{display:block}
    .sidebar{position:static;width:auto;flex-direction:row;align-items:center;padding:10px 14px;gap:8px}
    .logo{padding:4px 8px}
    .logo-mark{display:none}
    .logo-sub{display:none}
    .logo-name{font-size:15px}
    .sidebar nav{flex-direction:row;padding:0;flex:1;overflow-x:auto}
    .nav-item{padding:9px 10px;white-space:nowrap}
    .nav-item.active::before{display:none}
    .side-foot{display:none}
    main{margin-left:0;padding:20px 16px 60px}
    .topbar h1{font-size:23px}
    .order-row{grid-template-columns:1fr;gap:13px;padding:16px 4px}
    .o-side{flex-direction:row;align-items:center;justify-content:space-between}
    .hist-item{grid-template-columns:1fr;gap:8px}
    .frow{grid-template-columns:1fr}
    .modal{padding:20px 18px}
    .dr-body{padding:18px 18px 28px}
    .dr-head{padding:20px 18px 18px}
    .stamp{right:60px}
  }
</style>
</head>
<body>

<!-- ═══ Заставка ═══ -->
<div class="splash" id="splash" title="Нажмите, чтобы продолжить">
  <div class="splash-mark"></div>
  <div class="splash-name">СМЕНА</div>
  <div class="splash-sub">учёт производства</div>
  <div class="splash-track"><i></i></div>
  <div class="splash-skip">нажмите, чтобы продолжить</div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark"></div>
      <div>
        <div class="logo-name">СМЕНА</div>
        <div class="logo-sub">учёт производства</div>
      </div>
    </div>
    <nav>
      <button class="nav-item active" data-view="thermo"><i data-lucide="layers"></i>Термопанели<span class="count">0</span></button>
      <button class="nav-item" data-view="decor"><i data-lucide="shapes"></i>Фасадный декор<span class="count">0</span></button>
      <button class="nav-item" data-view="history"><i data-lucide="history"></i>История<span class="count">0</span></button>
    </nav>
    <div class="side-foot">
      <div class="side-foot-row"><span class="live-dot"></span><span id="footInfo">—</span></div>
      <div class="side-foot-sub">техпроцесс: шов → кирпич</div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="viewTitle">Термопанели</h1>
        <p class="sub" id="viewSub">заявки в цех · техпроцесс: шов → кирпич</p>
      </div>
      <button class="btn-primary" id="btnCreate"><i data-lucide="plus"></i>Создать заявку</button>
    </header>
    <div class="stats" id="statsLine"></div>
    <div id="list"></div>
  </main>
</div>

<div class="scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer"></aside>

<div class="scrim" id="modalScrim"></div>
<div class="modal-wrap" id="modalWrap"><div class="modal" id="modalBox"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ═══════════ Заставка ═══════════ */
(function(){
  const splash = document.getElementById('splash');
  const name = splash.querySelector('.splash-name');
  name.innerHTML = name.textContent.split('').map((ch, i) =>
    `<span style="animation-delay:${260 + i*60}ms">${ch}</span>`).join('');
  let closed = false;
  const close = () => {
    if(closed) return; closed = true;
    splash.classList.add('hide');
    document.body.classList.add('ready');
    document.body.classList.remove('splash-on');
    setTimeout(() => splash.remove(), 600);
  };
  splash.addEventListener('click', close);
  setTimeout(close, 2500);
})();

/* ═══════════ Данные и хранилище ═══════════ */
const KEY = 'smena_v2';
const HOUR = 36e5;
const ST_LABEL = { new:'Новый', production:'На производстве', ready:'Готова к отгрузке' };
const SEC_LABEL = { thermo:'Термопанели', decor:'Фасадный декор' };
const FORMAT_META = {
  brick: { label:'Кирпич', icon:'brick-wall' },
  rigel: { label:'Ригель', icon:'align-justify' },
  block: { label:'Блок',   icon:'box' }
};
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('smena_sync') : null;

const pad = n => String(n).padStart(2,'0');
const todayISO = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt = iso => iso.split('-').reverse().join('.');
const fmtTime = ts => { const d=new Date(ts); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many; };

function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
let state = load() || { orders: [], history: [] };

/* миграция: формат для старых заявок термопанелей + счётчики для элементов декора */
(function migrate(){
  let changed = false;
  state.orders.forEach(o => {
    if(o.section === 'thermo' && !o.format){ o.format = 'brick'; changed = true; }
    if(o.section === 'decor'){
      if(!Array.isArray(o.elements)){ o.elements = [{ name:'Элемент', qty:o.qty||0, done:0 }]; changed = true; }
      o.elements.forEach(e => { if(typeof e.done !== 'number'){ e.done = 0; changed = true; } });
    }
  });
  if(changed) persist();
})();

function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} if(bc) bc.postMessage('sync'); }
if(bc) bc.onmessage = () => { state = load() || state; renderAll(); if(drawerId) refreshDrawer(); };
window.addEventListener('storage', e => { if(e.key === KEY){ state = load() || state; renderAll(); if(drawerId) refreshDrawer(); } });

const icons = () => { try{ lucide.createIcons(); }catch(e){} };
const byId = id => state.orders.find(o => o.id === id);
const isDecor = o => o.section === 'decor';
const fmtMeta = o => FORMAT_META[o.format] || FORMAT_META.brick;
const orderAllDone = o => isDecor(o)
  ? o.elements.every(e => e.done >= e.qty)
  : (o.doneSeam >= o.qty && o.doneBrick >= o.qty);

let view = 'thermo';
let drawerId = null;

/* ═══════════ Правила удаления ═══════════ */
const histRemainMs = h => h.loggedAt + 24*HOUR - Date.now();
function fmtRemain(ms){
  const m = Math.max(1, Math.round(ms / 6e4));
  const h = Math.floor(m / 60);
  return h ? `${h} ч ${m % 60} мин` : `${m} мин`;
}
function histDelCtrl(h){
  const rem = histRemainMs(h);
  return rem > 0
    ? `<button type="button" class="hdel" data-del="${h.id}" title="Запись удаляется вместе с откатом прогресса заказа"><i data-lucide="trash-2"></i>Удалить · ещё ${fmtRemain(rem)}</button>`
    : `<span class="hexp" title="Удаление доступно только в первые 24 часа"><i data-lucide="lock"></i>срок удаления истёк (24 ч)</span>`;
}

/* ═══════════ Тосты ═══════════ */
function toast(msg, icon='check'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (icon === 'info' ? ' info' : '');
  el.innerHTML = `<i data-lucide="${icon}"></i><span>${msg}</span>`;
  wrap.appendChild(el); icons();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 3400);
}

/* ═══════════ Рендер навигации и списков ═══════════ */
function renderNav(){
  document.querySelectorAll('.nav-item').forEach(btn => {
    const v = btn.dataset.view;
    btn.classList.toggle('active', v === view);
    const c = btn.querySelector('.count');
    c.textContent = v === 'history' ? state.history.length : state.orders.filter(o => o.section === v).length;
  });
  const inWork = state.orders.filter(o => o.status === 'production').length;
  document.getElementById('footInfo').textContent = 'В работе: ' + inWork + ' заказ' + (inWork === 1 ? '' : (inWork < 5 && inWork > 1 ? 'а' : 'ов'));
}

function renderHead(){
  const t = document.getElementById('viewTitle'), s = document.getElementById('viewSub'), btn = document.getElementById('btnCreate');
  if(view === 'history'){
    t.textContent = 'История производства';
    s.textContent = 'отметки о выполненных работах · удаление записей — 24 часа';
    btn.style.display = 'none';
    const today = state.history.filter(h => h.date === todayISO()).length;
    document.getElementById('statsLine').innerHTML = `Записей: <b>${state.history.length}</b> · за сегодня: <b>${today}</b>`;
  } else {
    t.textContent = SEC_LABEL[view];
    s.textContent = 'заявки в цех · техпроцесс: шов → кирпич';
    btn.style.display = '';
    const list = state.orders.filter(o => o.section === view);
    const work = list.filter(o => o.status !== 'ready').length;
    const ready = list.filter(o => o.status === 'ready').length;
    document.getElementById('statsLine').innerHTML =
      `Всего заявок: <b>${list.length}</b> · в работе: <b>${work}</b> · готово к отгрузке: <b>${ready}</b>`;
  }
}

function fillHTML(o){
  const w = o.qty ? Math.round(clamp(o.doneSeam / o.qty, 0, 1) * 100) : 0;
  const b = o.qty ? Math.round(clamp(o.doneBrick / o.qty, 0, 1) * 100) : 0;
  return { w, b };
}
function premainHTML(rem){
  return rem === 0 ? `<span class="premain done">готово</span>` : `<span class="premain">ост. ${rem}</span>`;
}

/* блок прогресса в списке: у декора — строка на каждый элемент, у термопанелей — шов/кирпич */
function progressHTML(o){
  if(isDecor(o)){
    return o.elements.map(e => {
      const rem = e.qty - e.done;
      const pct = e.qty ? Math.round(clamp(e.done / e.qty, 0, 1) * 100) : 0;
      return `<div class="prow el">
        <span class="plabel el" title="${esc(e.name)}">${esc(e.name)}</span>
        <div class="track"><i style="width:${pct}%"></i></div>
        <span class="pval">${e.done}/${e.qty}</span>${premainHTML(rem)}
      </div>`;
    }).join('');
  }
  const rs = o.qty - o.doneSeam, rb = o.qty - o.doneBrick;
  const { w, b } = fillHTML(o);
  return `
    <div class="prow"><span class="plabel">ШОВ</span><div class="track"><i style="width:${w}%"></i></div><span class="pval">${o.doneSeam}/${o.qty}</span>${premainHTML(rs)}</div>
    <div class="prow"><span class="plabel">КИРПИЧ</span><div class="track brick"><i style="width:${b}%"></i></div><span class="pval">${o.doneBrick}/${o.qty}</span>${premainHTML(rb)}</div>`;
}

/* средняя колонка строки списка — своя для каждого раздела */
function orderMiddleHTML(o){
  if(isDecor(o)){
    const tags = o.elements.map(e =>
      `<span class="tag"><i data-lucide="component"></i>${esc(e.name)}<b class="tq">×${e.qty}</b></span>`).join('');
    const kinds = `${o.elements.length} ${plural(o.elements.length, 'вид', 'вида', 'видов')}`;
    return `<div class="o-colors">${tags}</div>
      <div class="o-spec">${o.qty} ${plural(o.qty, 'элемент', 'элемента', 'элементов')} · ${kinds}</div>`;
  }
  const fm = fmtMeta(o);
  return `<div class="o-colors">
      <span class="tag fmt-tag"><i data-lucide="${fm.icon}"></i>${fm.label}</span>
      <span class="tag"><i data-lucide="paint-roller"></i>${esc(o.seam)}</span>
      <span class="tag brick-tag"><i data-lucide="brick-wall"></i>${esc(o.brick)}</span>
    </div>
    <div class="o-spec">толщина ${o.thickness} см · ${o.qty} ${plural(o.qty, 'лист', 'листа', 'листов')}</div>`;
}

function renderOrders(){
  const box = document.getElementById('list');
  const list = state.orders
    .filter(o => o.section === view)
    .sort((a,b) => {
      const wa = a.status === 'ready' ? 1 : 0, wb = b.status === 'ready' ? 1 : 0;
      return wa - wb || b.createdAt - a.createdAt;
    });
  if(!list.length){
    box.innerHTML = `<div class="empty">
        <i data-lucide="clipboard-list"></i>
        <h3>Заявок пока нет</h3>
        <p>Создайте первую заявку — она появится в цехе со статусом «Новый».</p>
        <button class="btn-primary" id="emptyCreate"><i data-lucide="plus"></i>Создать заявку</button>
      </div>`;
    icons();
    document.getElementById('emptyCreate').onclick = () => openCreateModal(view);
    return;
  }
  box.innerHTML = `<div class="order-list">` + list.map((o, i) => `
    <article class="order-row" data-id="${o.id}" style="animation-delay:${i*45}ms">
      <div>
        <div class="o-num">№ ${esc(o.number)}</div>
        <div class="o-accepted">принят ${fmt(o.accepted)}</div>
      </div>
      <div>${orderMiddleHTML(o)}</div>
      <div class="o-progress">${progressHTML(o)}</div>
      <div class="o-side">
        <span class="badge b-${o.status}">${ST_LABEL[o.status]}</span>
        <i data-lucide="chevron-right" class="chev"></i>
      </div>
    </article>`).join('') + `</div>`;
  icons();
  box.querySelectorAll('.order-row').forEach(row => {
    row.onclick = () => openDrawer(row.dataset.id);
  });
}

/* что записано в записи истории — шов/кирпич (термопанели) или элементы (декор) */
function histWorkHTML(h){
  if(h.items && h.items.length){
    return h.items.filter(it => it.done > 0)
      .map(it => `<span><i data-lucide="component"></i>${esc(it.name)} +${it.done}</span>`).join('');
  }
  const parts = [];
  if(h.seamDone)  parts.push(`<span><i data-lucide="paint-roller"></i>Шов +${h.seamDone}</span>`);
  if(h.brickDone) parts.push(`<span class="bw"><i data-lucide="brick-wall"></i>Кирпич +${h.brickDone}</span>`);
  return parts.join('');
}

function renderHistory(){
  const box = document.getElementById('list');
  if(!state.history.length){
    box.innerHTML = `<div class="empty">
      <i data-lucide="history"></i>
      <h3>Записей пока нет</h3>
      <p>Здесь появятся отметки: кто, когда и что сделал по каждому заказу.</p>
    </div>`;
    icons(); return;
  }
  const items = [...state.history].sort((a,b) => b.loggedAt - a.loggedAt);
  box.innerHTML = `<div class="hist-list">` + items.map((h, i) => `
    <div class="hist-item" style="animation-delay:${i*45}ms">
      <div>
        <div class="h-date">${fmt(h.date)}</div>
        <div class="h-logged">запись ${fmtTime(h.loggedAt)}</div>
      </div>
      <div>
        <div class="h-head">Заказ <b>№ ${esc(h.orderNumber)}</b><span class="h-sec">${SEC_LABEL[h.section]}</span></div>
        <div class="h-work">${histWorkHTML(h)}</div>
        <div class="h-people">${h.workers.map(w => `<span class="pchip">${esc(w)}</span>`).join('')}</div>
        <div class="hist-del-row">${histDelCtrl(h)}</div>
      </div>
    </div>`).join('') + `</div>`;
  icons();
  box.querySelectorAll('.hdel').forEach(b => b.onclick = () => deleteHistoryEntry(b.dataset.del));
}

function renderAll(){ renderNav(); renderHead(); view === 'history' ? renderHistory() : renderOrders(); }

/* ═══════════ Drawer — карточка заявки ═══════════ */
function specRowsHTML(o){
  if(isDecor(o)){
    return o.elements.map(e =>
      `<div class="spec-row"><span>Элемент · ${esc(e.name)}</span><b class="mono">${e.qty} шт</b></div>`).join('') +
      `<div class="spec-row"><span>Позиций / элементов (итого)</span><b class="mono">${o.elements.length} / ${o.qty}</b></div>`;
  }
  const fm = fmtMeta(o);
  return `
    <div class="spec-row"><span>Формат панели</span><b><span style="display:inline-flex;align-items:center;gap:7px"><i data-lucide="${fm.icon}" style="width:14px;height:14px"></i>${fm.label}</span></b></div>
    <div class="spec-row"><span>Цвет / состав шва</span><b>${esc(o.seam)}</b></div>
    <div class="spec-row"><span>Цвет кирпича</span><b>${esc(o.brick)}</b></div>
    <div class="spec-row"><span>Толщина</span><b class="mono">${o.thickness} см</b></div>
    <div class="spec-row"><span>Количество листов</span><b class="mono">${o.qty}</b></div>
    <div class="spec-row"><span>Операций шов / кирпич</span><b class="mono">${o.qty} / ${o.qty}</b></div>`;
}

function dpBlock(o, stage){
  const isSeam = stage === 'seam';
  const done = isSeam ? o.doneSeam : o.doneBrick;
  const rem = o.qty - done;
  const colorHTML = isDecor(o) ? '' : `<span class="mk-color">${esc(isSeam ? o.seam : o.brick)}</span>`;
  const remHTML = rem === 0
    ? `<div class="dp-rem done" data-rem="${stage}"><i data-lucide="check"></i>Этап закрыт</div>`
    : `<div class="dp-rem" data-rem="${stage}">Осталось нанести: <b>${rem}</b></div>`;
  return `<div class="dp ${isSeam ? '' : 'brick-dp'}">
    <div class="dp-top">
      <span class="dp-label"><i data-lucide="${isSeam ? 'paint-roller' : 'brick-wall'}"></i>${isSeam ? 'ШОВ' : 'КИРПИЧ'}${colorHTML}</span>
      <span class="dp-nums" data-val="${stage}"><b>${done}</b>/${o.qty}</span>
    </div>
    <div class="track big ${isSeam ? '' : 'brick'}"><i data-dfill="${stage}" style="width:0%"></i></div>
    ${remHTML}
  </div>`;
}

/* блок позиции элемента (декор) */
function dpElemBlock(e, i){
  const rem = e.qty - e.done;
  const remHTML = rem === 0
    ? `<div class="dp-rem done" data-erem="${i}"><i data-lucide="check"></i>Позиция закрыта</div>`
    : `<div class="dp-rem" data-erem="${i}">Осталось сделать: <b>${rem}</b></div>`;
  return `<div class="dp">
    <div class="dp-top">
      <span class="dp-label"><i data-lucide="component"></i>${esc(e.name)}</span>
      <span class="dp-nums" data-eval="${i}"><b>${e.done}</b>/${e.qty}</span>
    </div>
    <div class="track big"><i data-edfill="${i}" style="width:0%"></i></div>
    ${remHTML}
  </div>`;
}

function delZoneHTML(o){
  if(o.status === 'new'){
    return `<div class="del-zone">
      <button type="button" class="btn-danger-outline" id="drDelete"><i data-lucide="trash-2"></i>Удалить заявку</button>
      <p class="del-hint"><i data-lucide="info"></i>Удалить можно только заявку со статусом «Новый» — пока цех не приступил к работе. Заявка и её записи истории будут удалены безвозвратно.</p>
    </div>`;
  }
  const why = o.status === 'production' ? 'уже на производстве' : 'готова к отгрузке';
  return `<div class="del-zone">
    <button type="button" class="btn-danger-outline" disabled><i data-lucide="lock"></i>Удаление недоступно</button>
    <p class="del-hint locked"><i data-lucide="shield-alert"></i>Заявка ${why} — удалить её нельзя. Это защищает данные цеха от случайной потери.</p>
  </div>`;
}

function renderDrawer(){
  const o = byId(drawerId); if(!o) return;
  const dr = document.getElementById('drawer');
  const hist = state.history.filter(h => h.orderId === o.id).sort((a,b) => b.loggedAt - a.loggedAt);
  const allDone = orderAllDone(o);
  const dpHTML = isDecor(o)
    ? o.elements.map((e, i) => dpElemBlock(e, i)).join('')
    : dpBlock(o, 'seam') + dpBlock(o, 'brick');
  dr.innerHTML = `
    <div class="dr-head">
      <div class="dr-top">
        <div>
          <div class="dr-num">№ ${esc(o.number)}</div>
          <div class="dr-sub">${SEC_LABEL[o.section]} · принят ${fmt(o.accepted)}</div>
          <span class="badge dr-badge b-${o.status}" id="drBadge">${ST_LABEL[o.status]}</span>
        </div>
        <button class="icon-btn" id="drClose" title="Закрыть"><i data-lucide="x"></i></button>
      </div>
      <div class="stamp" id="drStamp" ${o.status === 'ready' ? '' : 'hidden'}>Готов к отгрузке<small>СМЕНА · ОТК</small></div>
    </div>
    <div class="dr-body">
      ${specRowsHTML(o)}

      ${dpHTML}

      <div class="dr-actions">
        <button class="btn-primary" id="drMark" ${allDone ? 'disabled' : ''}>
          <i data-lucide="hammer"></i>${allDone ? (isDecor(o) ? 'Все позиции закрыты' : 'Все этапы закрыты') : 'Отметить сделанное'}
        </button>
      </div>

      <div class="dr-status">
        <span class="lbl">Статус заявки</span>
        <div class="seg" id="drSeg">
          <button type="button" data-st="new">Новый</button>
          <button type="button" data-st="production">На производстве</button>
          <button type="button" data-st="ready">Готов к отгрузке</button>
        </div>
      </div>

      ${delZoneHTML(o)}

      <div class="dr-hist">
        <h4>История по заказу</h4>
        ${hist.length ? hist.map(h => `
          <div class="he">
            <div class="he-date">${fmt(h.date)}</div>
            <div class="he-work">${histWorkHTML(h)}</div>
            <div class="he-people">Выполняли: ${h.workers.map(esc).join(', ')}</div>
            <div class="hist-del-row">${histDelCtrl(h)}</div>
          </div>`).join('') : `<div class="dr-empty">Отметок по заказу ещё не было.</div>`}
      </div>
    </div>`;
  icons();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if(isDecor(o)){
      o.elements.forEach((e, i) => {
        const f = dr.querySelector(`[data-edfill="${i}"]`);
        if(f) f.style.width = (e.qty ? Math.round(e.done / e.qty * 100) : 0) + '%';
      });
    } else {
      const { w, b } = fillHTML(o);
      const fs = dr.querySelector('[data-dfill="seam"]'), fb = dr.querySelector('[data-dfill="brick"]');
      if(fs) fs.style.width = w + '%';
      if(fb) fb.style.width = b + '%';
    }
  }));
  dr.querySelector('#drClose').onclick = closeDrawer;
  const mark = dr.querySelector('#drMark');
  if(mark) mark.onclick = () => openMarkModal(o.id);
  dr.querySelectorAll('#drSeg button').forEach(b => {
    b.classList.toggle('on', b.dataset.st === o.status);
    b.onclick = () => setStatus(o.id, b.dataset.st);
  });
  const del = dr.querySelector('#drDelete');
  if(del) del.onclick = () => deleteOrder(o.id);
  dr.querySelectorAll('.hdel').forEach(b => b.onclick = () => deleteHistoryEntry(b.dataset.del));
}
function openDrawer(id){
  drawerId = id;
  renderDrawer();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerScrim').classList.add('show');
}
function closeDrawer(){
  drawerId = null;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerScrim').classList.remove('show');
}
function refreshDrawer(){ if(drawerId) renderDrawer(); }
document.getElementById('drawerScrim').onclick = closeDrawer;

/* Точечное обновление открытого drawer — полосы доигрывают анимацию */
function updateDrawerLive(o){
  if(!drawerId || drawerId !== o.id) return;
  const dr = document.getElementById('drawer');
  if(isDecor(o)){
    o.elements.forEach((e, i) => {
      const rem = e.qty - e.done;
      const fill = dr.querySelector(`[data-edfill="${i}"]`);
      if(fill) fill.style.width = (e.qty ? Math.round(e.done / e.qty * 100) : 0) + '%';
      const val = dr.querySelector(`[data-eval="${i}"]`);
      if(val) val.innerHTML = `<b>${e.done}</b>/${e.qty}`;
      const remEl = dr.querySelector(`[data-erem="${i}"]`);
      if(remEl){
        if(rem === 0){ remEl.classList.add('done'); remEl.innerHTML = `<i data-lucide="check"></i>Позиция закрыта`; }
        else { remEl.classList.remove('done'); remEl.innerHTML = `Осталось сделать: <b>${rem}</b>`; }
      }
    });
  } else {
    ['seam','brick'].forEach(stage => {
      const done = stage === 'seam' ? o.doneSeam : o.doneBrick;
      const rem = o.qty - done;
      const fill = dr.querySelector(`[data-dfill="${stage}"]`);
      if(fill) fill.style.width = (o.qty ? Math.round(done / o.qty * 100) : 0) + '%';
      const val = dr.querySelector(`[data-val="${stage}"]`);
      if(val) val.innerHTML = `<b>${done}</b>/${o.qty}`;
      const remEl = dr.querySelector(`[data-rem="${stage}"]`);
      if(remEl){
        if(rem === 0){ remEl.classList.add('done'); remEl.innerHTML = `<i data-lucide="check"></i>Этап закрыт`; }
        else { remEl.classList.remove('done'); remEl.innerHTML = `Осталось нанести: <b>${rem}</b>`; }
      }
    });
  }
  const badge = dr.querySelector('#drBadge');
  if(badge){ badge.className = 'badge dr-badge b-' + o.status; badge.textContent = ST_LABEL[o.status]; }
  dr.querySelectorAll('#drSeg button').forEach(b => b.classList.toggle('on', b.dataset.st === o.status));
  const stamp = dr.querySelector('#drStamp');
  if(stamp && o.status === 'ready' && stamp.hidden) stamp.hidden = false;
  const mark = dr.querySelector('#drMark');
  if(mark && orderAllDone(o)){
    mark.disabled = true;
    mark.innerHTML = `<i data-lucide="check"></i>${isDecor(o) ? 'Все позиции закрыты' : 'Все этапы закрыты'}`;
  }
  icons();
}

function setStatus(id, st){
  const o = byId(id); if(!o || o.status === st) return;
  o.status = st; persist();
  toast(`Заказ №${esc(o.number)} — статус: ${ST_LABEL[st]}`, 'info');
  updateDrawerLive(o); renderAll();
}

/* ═══════════ Модалы ═══════════ */
const modalWrap = document.getElementById('modalWrap');
const modalScrim = document.getElementById('modalScrim');
const modalBox = document.getElementById('modalBox');
modalScrim.onclick = closeModal;
function openModal(){ modalWrap.classList.add('show'); modalScrim.classList.add('show'); }
function closeModal(){ modalWrap.classList.remove('show'); modalScrim.classList.remove('show'); }

function mHead(kicker, title){
  return `<div class="m-head">
    <div><div class="m-kicker">${kicker}</div><h3>${title}</h3></div>
    <button type="button" class="icon-btn" id="mClose"><i data-lucide="x"></i></button>
  </div>`;
}
function bindClose(){ modalBox.querySelector('#mClose').onclick = closeModal; }

/* ── Универсальное подтверждение удаления ── */
function openConfirm(title, text, warn, onYes){
  modalBox.innerHTML = mHead('Подтверждение удаления', title) + `
    <p class="confirm-text">${text}</p>
    <div class="confirm-warn"><i data-lucide="alert-triangle"></i><span>${warn}</span></div>
    <div class="confirm-actions">
      <button type="button" class="c-cancel" id="cNo">Отмена</button>
      <button type="button" class="c-del" id="cYes"><i data-lucide="trash-2"></i>Удалить безвозвратно</button>
    </div>`;
  icons(); bindClose();
  modalBox.querySelector('#cNo').onclick = closeModal;
  modalBox.querySelector('#cYes').onclick = onYes;
  openModal();
}

/* ── Удаление заявки (только «Новый») ── */
function deleteOrder(id){
  const o = byId(id); if(!o) return;
  if(o.status !== 'new'){ toast('Удалять можно только заявки со статусом «Новый»', 'info'); return; }
  const unit = isDecor(o)
    ? `${o.qty} ${plural(o.qty, 'элемент', 'элемента', 'элементов')}`
    : `формат «${fmtMeta(o).label}», ${o.qty} ${plural(o.qty, 'лист', 'листа', 'листов')}`;
  openConfirm(
    `Удалить заявку № ${esc(o.number)}?`,
    `Заявка <b>№ ${esc(o.number)}</b> (${SEC_LABEL[o.section]}, ${unit}) будет удалена из раздела, и сотрудники цеха перестанут её видеть.`,
    `Восстановить данные будет <b>невозможно</b>. Если по заявке уже есть записи истории — они тоже удалятся.`,
    () => {
      state.orders = state.orders.filter(x => x.id !== id);
      state.history = state.history.filter(h => h.orderId !== id);
      persist(); closeModal(); closeDrawer();
      toast(`Заявка №${esc(o.number)} удалена`, 'info');
      renderAll();
    }
  );
}

/* ── Удаление записи истории (только 24 часа) ── */
function deleteHistoryEntry(hid){
  const h = state.history.find(x => x.id === hid); if(!h) return;
  if(histRemainMs(h) <= 0){ toast('Срок удаления истёк — запись старше 24 часов', 'info'); return; }
  const what = h.items && h.items.length
    ? h.items.map(it => `${it.name} +${it.done}`).join(', ')
    : [h.seamDone ? `шов +${h.seamDone}` : '', h.brickDone ? `кирпич +${h.brickDone}` : ''].filter(Boolean).join(', ');
  openConfirm(
    'Удалить запись из истории?',
    `Запись от <b>${fmt(h.date)}</b> по заказу <b>№ ${esc(h.orderNumber)}</b> (${what}) будет удалена. Сотрудники: ${h.workers.map(esc).join(', ')}.`,
    `Прогресс заказа откатится: сделанное количество будет вычтено. Восстановить запись будет <b>невозможно</b>.`,
    () => {
      const o = byId(h.orderId);
      if(o){
        if(h.items && h.items.length && isDecor(o)){
          h.items.forEach(it => {
            const el = (o.elements[it.idx] && o.elements[it.idx].name === it.name)
              ? o.elements[it.idx]
              : o.elements.find(x => x.name === it.name);
            if(el) el.done = Math.max(0, el.done - it.done);
          });
        } else {
          o.doneSeam = Math.max(0, o.doneSeam - h.seamDone);
          o.doneBrick = Math.max(0, o.doneBrick - h.brickDone);
        }
        if(o.status === 'ready' && !orderAllDone(o)) o.status = 'production';
      }
      state.history = state.history.filter(x => x.id !== hid);
      persist(); closeModal();
      toast(`Запись удалена · прогресс заказа №${esc(h.orderNumber)} откатился`, 'info');
      renderAll(); refreshDrawer();
    }
  );
}

/* ── Создание заявки ── */
function openCreateModal(section){
  const decor = section === 'decor';

  function elemRowHTML(){
    return `<div class="elem-row">
      <input class="e-name" placeholder="Название элемента" autocomplete="off">
      <input class="e-qty" inputmode="numeric" placeholder="0" autocomplete="off">
      <button type="button" class="icon-btn e-rm" title="Убрать элемент"><i data-lucide="x"></i></button>
    </div>`;
  }
  function bindDecorRows(){
    const rowsBox = modalBox.querySelector('#elemRows');
    const totalEl = modalBox.querySelector('#elemTotal');
    const wordEl  = modalBox.querySelector('#elemTotalWord');
    const syncRemove = () => {
      const rows = rowsBox.querySelectorAll('.elem-row');
      rows.forEach(r => r.querySelector('.e-rm').style.visibility = rows.length > 1 ? 'visible' : 'hidden');
    };
    const recalc = () => {
      let sum = 0;
      rowsBox.querySelectorAll('.e-qty').forEach(q => sum += parseInt(q.value.replace(/\D+/g,''), 10) || 0);
      totalEl.textContent = sum;
      wordEl.textContent = plural(sum, 'элемент', 'элемента', 'элементов');
    };
    const addRow = () => {
      rowsBox.insertAdjacentHTML('beforeend', elemRowHTML());
      const row = rowsBox.lastElementChild;
      icons();
      const q = row.querySelector('.e-qty');
      q.addEventListener('input', () => { q.value = q.value.replace(/\D+/g,''); recalc(); });
      row.querySelector('.e-rm').onclick = () => { row.remove(); syncRemove(); recalc(); };
      syncRemove();
      row.querySelector('.e-name').focus();
    };
    modalBox.querySelector('#addElem').onclick = addRow;
    addRow();
  }

  const decorFields = `
      <div class="field">
        <label><span class="fnum">03</span>Элементы</label>
        <div class="elem-head"><span>Название элемента</span><span>Количество элементов</span><span></span></div>
        <div id="elemRows"></div>
        <button type="button" class="add-elem" id="addElem"><i data-lucide="plus"></i>Добавить элемент</button>
        <div class="elem-total">Итого: <b id="elemTotal">0</b> <span id="elemTotalWord">элементов</span></div>
        <div class="ferr" id="errElem"></div>
        <div class="hint"><i data-lucide="info"></i><span>Каждая позиция ведётся отдельно: в списке и карточке будет видно, сколько сделано и сколько осталось по <b>каждому элементу</b>.</span></div>
      </div>`;

  const thermoFields = `
      <div class="field">
        <label><span class="fnum">03</span>Формат панели</label>
        <div class="format-seg" id="formatSeg">
          <button type="button" data-f="brick" class="on"><i data-lucide="brick-wall"></i>Кирпич</button>
          <button type="button" data-f="rigel"><i data-lucide="align-justify"></i>Ригель</button>
          <button type="button" data-f="block"><i data-lucide="box"></i>Блок</button>
        </div>
      </div>
      <div class="frow">
        <div class="field">
          <label><span class="fnum">04</span>Цвет / состав шва</label>
          <input name="seam" placeholder="напр. Серый мрамор КМ-12">
        </div>
        <div class="field">
          <label><span class="fnum">05</span>Цвет кирпича</label>
          <input name="brick" placeholder="напр. Терракота">
        </div>
      </div>
      <div class="field">
        <label><span class="fnum">06</span>Толщина панели, см</label>
        <div class="thick-seg" id="thickSeg">
          ${[3,4,5,6,7,8,9,10].map(t => `<button type="button" data-t="${t}" ${t===5?'class="on"':''}>${t}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label><span class="fnum">07</span>Количество листов (панелей)</label>
        <input name="qty" class="big-mono" inputmode="numeric" placeholder="500">
        <div class="hint"><i data-lucide="info"></i><span>Этапы рассчитаются автоматически: при 500 панелях цеху нужно нанести <b>500 раз шов</b> и <b>500 раз кирпич</b> — отдельно это указывать не нужно.</span></div>
      </div>`;

  modalBox.innerHTML = mHead(`Новая заявка · ${SEC_LABEL[section]}`, 'Оформление в цех') + `
    <form id="createForm" novalidate>
      <div class="field">
        <label><span class="fnum">01</span>Номер заказа</label>
        <input name="number" class="big-mono" inputmode="numeric" placeholder="1042" autocomplete="off">
        <div class="ferr" id="errNum"></div>
      </div>
      <div class="field">
        <label><span class="fnum">02</span>Дата приёма заказа</label>
        <input type="date" name="accepted" value="${todayISO()}">
      </div>
      ${decor ? decorFields : thermoFields}
      <div class="hint" style="margin-top:16px"><i data-lucide="pencil-line"></i><span>Ошиблись при оформлении? Заявку со статусом «Новый» можно удалить в её карточке и создать заново.</span></div>
      <button type="submit" class="btn-primary m-submit"><i data-lucide="package-check"></i>Оформить заявку</button>
    </form>`;
  icons(); bindClose();

  const numIn = modalBox.querySelector('[name="number"]');
  numIn.addEventListener('input', () => { numIn.value = numIn.value.replace(/\D+/g,''); });

  if(decor) bindDecorRows();
  else {
    const qtyIn = modalBox.querySelector('[name="qty"]');
    qtyIn.addEventListener('input', () => { qtyIn.value = qtyIn.value.replace(/\D+/g,''); });
    modalBox.querySelector('#formatSeg').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      modalBox.querySelectorAll('#formatSeg button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    });
    modalBox.querySelector('#thickSeg').addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      modalBox.querySelectorAll('#thickSeg button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    });
  }

  modalBox.querySelector('#createForm').onsubmit = e => {
    e.preventDefault();
    const f = e.target;
    const number = f.number.value.trim();
    const accepted = f.accepted.value;
    const errNum = modalBox.querySelector('#errNum');
    errNum.classList.remove('show');
    if(!number){ errNum.textContent = 'Укажите номер заказа (цифрами).'; errNum.classList.add('show'); return; }
    if(state.orders.some(o => o.number === number)){ errNum.textContent = 'Заявка с таким номером уже существует.'; errNum.classList.add('show'); return; }
    if(!accepted) return;

    let payload;
    if(decor){
      const rowsData = [...modalBox.querySelectorAll('.elem-row')].map(r => ({
        name: r.querySelector('.e-name').value.trim(),
        qty: parseInt(r.querySelector('.e-qty').value, 10) || 0
      }));
      const errElem = modalBox.querySelector('#errElem');
      errElem.classList.remove('show');
      const valid = rowsData.filter(r => r.name && r.qty >= 1);
      const incomplete = rowsData.some(r => (r.name && !r.qty) || (!r.name && r.qty));
      if(!valid.length){
        errElem.textContent = 'Добавьте хотя бы один элемент с названием и количеством.';
        errElem.classList.add('show'); return;
      }
      if(incomplete){
        errElem.textContent = 'Заполните название и количество во всех строках либо уберите пустые (×).';
        errElem.classList.add('show'); return;
      }
      payload = { elements: valid.map(el => ({ ...el, done: 0 })), qty: valid.reduce((s, el) => s + el.qty, 0) };
    } else {
      const seam = f.seam.value.trim(), brick = f.brick.value.trim();
      const qty = parseInt(f.qty.value, 10);
      if(!seam || !brick || !qty || qty < 1) return;
      payload = {
        format: modalBox.querySelector('#formatSeg .on').dataset.f,
        seam, brick,
        thickness: +modalBox.querySelector('#thickSeg .on').dataset.t,
        qty
      };
    }

    const o = {
      id: uid(), section, number, accepted,
      ...payload, doneSeam: 0, doneBrick: 0, status: 'new', createdAt: Date.now()
    };
    state.orders.unshift(o); persist();
    closeModal();
    toast(`Заявка №${esc(number)} передана в цех — статус «Новый»`);
    renderAll();
    openDrawer(o.id);
  };
  openModal();
  numIn.focus();
}
document.getElementById('btnCreate').onclick = () => openCreateModal(view === 'history' ? 'thermo' : view);

/* ── Отметка сделанного: декор — по каждому элементу ── */
function openMarkModalDecor(o){
  const stages = o.elements.map((e, i) => {
    const rem = e.qty - e.done;
    return `<div class="mk-stage">
      <div class="mk-head">
        <span class="dp-label"><i data-lucide="component"></i>${esc(e.name)}</span>
        <span class="mk-rem ${rem === 0 ? 'zero' : ''}">${rem === 0 ? 'закрыто' : 'осталось ' + rem}</span>
      </div>
      <div class="mk-inputs">
        <input type="number" class="mk-in" data-idx="${i}" min="0" max="${rem}" step="1" placeholder="0" ${rem === 0 ? 'disabled' : ''}>
        <span class="mk-unit">элементов сделано сейчас</span>
      </div>
      <div class="mk-clamp" data-clamp="${i}"></div>
      <div class="mk-calc">
        <div class="track" style="height:10px"><i data-prev="${i}" style="width:${Math.round(e.done/e.qty*100)}%"></i></div>
        <div class="mk-calc-row">было ${e.done} → станет <b data-new="${i}">${e.done}</b> из ${e.qty} · остаток <b data-remv="${i}">${rem}</b></div>
      </div>
    </div>`;
  }).join('');

  modalBox.innerHTML = mHead(`Отметка выполнения · ${SEC_LABEL[o.section]}`, `Заказ № ${esc(o.number)}`) + `
    <form id="markForm" novalidate>
      ${stages}
      <div class="field">
        <label>Кто сделал — сотрудники</label>
        <div class="chips" id="chipsBox">
          <input id="workerInput" placeholder="Имя сотрудника + Enter" autocomplete="off">
        </div>
        <div class="ferr" id="errWorkers"></div>
      </div>
      <div class="field">
        <label>Дата выполнения</label>
        <input type="date" id="mkDate" value="${todayISO()}">
      </div>
      <div class="hint"><i data-lucide="timer-reset"></i><span>Ошиблись в количестве? Запись можно удалить в течение <b>24 часов</b> — прогресс заказа откатится автоматически.</span></div>
      <button type="submit" class="btn-primary m-submit"><i data-lucide="clipboard-list"></i>Записать в историю</button>
    </form>`;
  icons(); bindClose();

  const inputs = [...modalBox.querySelectorAll('.mk-in')];
  const clampHint = (inp, max, hintEl) => {
    let v = inp.value.replace(/\D+/g,'');
    if(v === ''){ hintEl.classList.remove('show'); inp.value = ''; return; }
    let n = parseInt(v, 10);
    if(n > max){ inp.value = max; hintEl.textContent = `Больше остатка — записано максимально: ${max}`; hintEl.classList.add('show'); }
    else { hintEl.classList.remove('show'); inp.value = String(n); }
  };
  const recalc = () => inputs.forEach(inp => {
    const i = +inp.dataset.idx;
    const e = o.elements[i];
    const rem = e.qty - e.done;
    const v = Math.min(parseInt(inp.value, 10) || 0, rem);
    modalBox.querySelector(`[data-new="${i}"]`).textContent = e.done + v;
    modalBox.querySelector(`[data-remv="${i}"]`).textContent = rem - v;
    modalBox.querySelector(`[data-prev="${i}"]`).style.width = Math.round(clamp((e.done + v) / e.qty, 0, 1) * 100) + '%';
  });
  inputs.forEach(inp => inp.addEventListener('input', () => {
    const i = +inp.dataset.idx;
    const e = o.elements[i];
    clampHint(inp, e.qty - e.done, modalBox.querySelector(`[data-clamp="${i}"]`));
    recalc();
  }));

  /* чипы сотрудников */
  const workers = [];
  const chipsBox = modalBox.querySelector('#chipsBox');
  const wInput = modalBox.querySelector('#workerInput');
  const renderChips = () => {
    chipsBox.querySelectorAll('.chip').forEach(c => c.remove());
    workers.forEach((w, i) => {
      const el = document.createElement('span');
      el.className = 'chip';
      el.innerHTML = `${esc(w)}<button type="button" data-i="${i}" title="Убрать">&times;</button>`;
      chipsBox.insertBefore(el, wInput);
    });
  };
  const addWorker = () => {
    const v = wInput.value.replace(/[,;]+$/,'').trim();
    if(v.length >= 2 && !workers.some(w => w.toLowerCase() === v.toLowerCase())){ workers.push(v); renderChips(); }
    wInput.value = '';
  };
  wInput.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ',' || e.key === ';'){ e.preventDefault(); addWorker(); }
    else if(e.key === 'Backspace' && wInput.value === '' && workers.length){ workers.pop(); renderChips(); }
  });
  wInput.addEventListener('blur', addWorker);
  chipsBox.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if(b){ workers.splice(+b.dataset.i, 1); renderChips(); }
  });

  modalBox.querySelector('#markForm').onsubmit = e => {
    e.preventDefault();
    const marks = inputs.map(inp => {
      const i = +inp.dataset.idx;
      const rem = o.elements[i].qty - o.elements[i].done;
      return { i, v: Math.min(parseInt(inp.value, 10) || 0, rem) };
    });
    const total = marks.reduce((s, m) => s + m.v, 0);
    const errW = modalBox.querySelector('#errWorkers');
    errW.classList.remove('show');
    if(total <= 0){ toast('Укажите количество сделанных элементов хотя бы по одной позиции', 'info'); return; }
    if(!workers.length){ errW.textContent = 'Укажите хотя бы одного сотрудника, который делал работу.'; errW.classList.add('show'); return; }
    const date = modalBox.querySelector('#mkDate').value || todayISO();
    marks.forEach(m => o.elements[m.i].done += m.v);
    if(o.status === 'new') o.status = 'production';
    const items = marks.filter(m => m.v > 0).map(m => ({ idx: m.i, name: o.elements[m.i].name, done: m.v }));
    state.history.push({ id: uid(), orderId: o.id, orderNumber: o.number, section: o.section, date, items, seamDone: 0, brickDone: 0, workers: [...workers], loggedAt: Date.now() });
    persist(); closeModal();
    toast(`Заказ №${esc(o.number)}: ${items.map(it => `${it.name} +${it.done}`).join(', ')}`);
    if(orderAllDone(o) && o.status !== 'ready')
      setTimeout(() => toast('Все позиции закрыты — заявку можно перевести в «Готова к отгрузке»', 'info'), 500);
    renderAll(); updateDrawerLive(o);
  };
  openModal();
  const first = inputs.find(inp => !inp.disabled);
  if(first) first.focus();
}

/* ── Отметка сделанного: термопанели — шов/кирпич ── */
function openMarkModal(id){
  const o = byId(id); if(!o) return;
  if(isDecor(o)) return openMarkModalDecor(o);
  const remS = o.qty - o.doneSeam, remB = o.qty - o.doneBrick;
  const fm = fmtMeta(o);
  const seamColor = `<span class="mk-color">${esc(o.seam)}</span>`;
  const brickColor = `<span class="mk-color">${esc(o.brick)}</span>`;
  modalBox.innerHTML = mHead(`Отметка выполнения · ${SEC_LABEL[o.section]}`, `Заказ № ${esc(o.number)} · ${fm.label}`) + `
    <form id="markForm" novalidate>
      <div class="mk-stage">
        <div class="mk-head">
          <span class="dp-label"><i data-lucide="paint-roller"></i>ЭТАП 1 · ШОВ${seamColor}</span>
          <span class="mk-rem ${remS === 0 ? 'zero' : ''}">${remS === 0 ? 'этап закрыт' : 'осталось ' + remS}</span>
        </div>
        <div class="mk-inputs">
          <input type="number" id="inSeam" min="0" max="${remS}" step="1" placeholder="0" ${remS === 0 ? 'disabled' : ''}>
          <span class="mk-unit">листов сделано сейчас</span>
        </div>
        <div class="mk-clamp" id="clampS"></div>
        <div class="mk-calc">
          <div class="track" style="height:10px"><i id="prevSeam" style="width:${Math.round(o.doneSeam/o.qty*100)}%"></i></div>
          <div class="mk-calc-row">было ${o.doneSeam} → станет <b id="newSeam">${o.doneSeam}</b> из ${o.qty} · остаток <b id="remSeamV">${remS}</b></div>
        </div>
      </div>
      <div class="mk-stage">
        <div class="mk-head">
          <span class="dp-label"><i data-lucide="brick-wall"></i>ЭТАП 2 · КИРПИЧ${brickColor}</span>
          <span class="mk-rem ${remB === 0 ? 'zero' : ''}">${remB === 0 ? 'этап закрыт' : 'осталось ' + remB}</span>
        </div>
        <div class="mk-inputs">
          <input type="number" id="inBrick" min="0" max="${remB}" step="1" placeholder="0" ${remB === 0 ? 'disabled' : ''}>
          <span class="mk-unit">листов сделано сейчас</span>
        </div>
        <div class="mk-clamp" id="clampB"></div>
        <div class="mk-calc">
          <div class="track brick" style="height:10px"><i id="prevBrick" style="width:${Math.round(o.doneBrick/o.qty*100)}%"></i></div>
          <div class="mk-calc-row">было ${o.doneBrick} → станет <b id="newBrick">${o.doneBrick}</b> из ${o.qty} · остаток <b id="remBrickV">${remB}</b></div>
        </div>
      </div>
      <div class="field">
        <label>Кто сделал — сотрудники</label>
        <div class="chips" id="chipsBox">
          <input id="workerInput" placeholder="Имя сотрудника + Enter" autocomplete="off">
        </div>
        <div class="ferr" id="errWorkers"></div>
      </div>
      <div class="field">
        <label>Дата выполнения</label>
        <input type="date" id="mkDate" value="${todayISO()}">
      </div>
      <div class="hint"><i data-lucide="timer-reset"></i><span>Ошиблись в количестве? Запись можно удалить в течение <b>24 часов</b> — прогресс заказа откатится автоматически.</span></div>
      <button type="submit" class="btn-primary m-submit"><i data-lucide="clipboard-list"></i>Записать в историю</button>
    </form>`;
  icons(); bindClose();

  const inSeam = modalBox.querySelector('#inSeam'), inBrick = modalBox.querySelector('#inBrick');
  const clampHint = (inp, max, hintEl) => {
    let v = inp.value.replace(/\D+/g,'');
    if(v === ''){ hintEl.classList.remove('show'); inp.value = ''; return; }
    let n = parseInt(v, 10);
    if(n > max){ inp.value = max; hintEl.textContent = `Больше остатка — записано максимально: ${max}`; hintEl.classList.add('show'); }
    else { hintEl.classList.remove('show'); inp.value = String(n); }
  };
  const recalc = () => {
    const vs = parseInt(inSeam.value, 10) || 0, vb = parseInt(inBrick.value, 10) || 0;
    modalBox.querySelector('#newSeam').textContent = o.doneSeam + vs;
    modalBox.querySelector('#remSeamV').textContent = remS - vs;
    modalBox.querySelector('#prevSeam').style.width = Math.round(clamp((o.doneSeam + vs) / o.qty, 0, 1) * 100) + '%';
    modalBox.querySelector('#newBrick').textContent = o.doneBrick + vb;
    modalBox.querySelector('#remBrickV').textContent = remB - vb;
    modalBox.querySelector('#prevBrick').style.width = Math.round(clamp((o.doneBrick + vb) / o.qty, 0, 1) * 100) + '%';
  };
  inSeam.addEventListener('input', () => { clampHint(inSeam, remS, modalBox.querySelector('#clampS')); recalc(); });
  inBrick.addEventListener('input', () => { clampHint(inBrick, remB, modalBox.querySelector('#clampB')); recalc(); });

  const workers = [];
  const chipsBox = modalBox.querySelector('#chipsBox');
  const wInput = modalBox.querySelector('#workerInput');
  const renderChips = () => {
    chipsBox.querySelectorAll('.chip').forEach(c => c.remove());
    workers.forEach((w, i) => {
      const el = document.createElement('span');
      el.className = 'chip';
      el.innerHTML = `${esc(w)}<button type="button" data-i="${i}" title="Убрать">&times;</button>`;
      chipsBox.insertBefore(el, wInput);
    });
  };
  const addWorker = () => {
    const v = wInput.value.replace(/[,;]+$/,'').trim();
    if(v.length >= 2 && !workers.some(w => w.toLowerCase() === v.toLowerCase())){ workers.push(v); renderChips(); }
    wInput.value = '';
  };
  wInput.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ',' || e.key === ';'){ e.preventDefault(); addWorker(); }
    else if(e.key === 'Backspace' && wInput.value === '' && workers.length){ workers.pop(); renderChips(); }
  });
  wInput.addEventListener('blur', addWorker);
  chipsBox.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if(b){ workers.splice(+b.dataset.i, 1); renderChips(); }
  });

  modalBox.querySelector('#markForm').onsubmit = e => {
    e.preventDefault();
    const vs = Math.min(parseInt(inSeam.value, 10) || 0, remS);
    const vb = Math.min(parseInt(inBrick.value, 10) || 0, remB);
    const errW = modalBox.querySelector('#errWorkers');
    errW.classList.remove('show');
    if(vs + vb <= 0){ toast('Укажите количество по этапу — шов или кирпич', 'info'); return; }
    if(!workers.length){ errW.textContent = 'Укажите хотя бы одного сотрудника, который делал работу.'; errW.classList.add('show'); return; }
    const date = modalBox.querySelector('#mkDate').value || todayISO();
    o.doneSeam += vs; o.doneBrick += vb;
    if(o.status === 'new') o.status = 'production';
    state.history.push({ id: uid(), orderId: o.id, orderNumber: o.number, section: o.section, date, seamDone: vs, brickDone: vb, workers: [...workers], loggedAt: Date.now() });
    persist(); closeModal();
    const parts = [];
    if(vs) parts.push(`шов +${vs}`); if(vb) parts.push(`кирпич +${vb}`);
    toast(`Заказ №${esc(o.number)}: ${parts.join(', ')}`);
    if(orderAllDone(o) && o.status !== 'ready')
      setTimeout(() => toast('Все этапы закрыты — заявку можно перевести в «Готова к отгрузке»', 'info'), 500);
    renderAll(); updateDrawerLive(o);
  };
  openModal();
  if(!inSeam.disabled) inSeam.focus(); else if(!inBrick.disabled) inBrick.focus();
}

/* ═══════════ Навигация и клавиши ═══════════ */
document.querySelectorAll('.nav-item').forEach(b => b.onclick = () => {
  view = b.dataset.view;
  closeDrawer(); renderAll();
  window.scrollTo({ top: 0 });
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(modalWrap.classList.contains('show')) closeModal();
  else closeDrawer();
});

renderAll();
</script>
